[project]
name = "hyacinth"
version = "0.1.0"
description = "Windows local Excel editing and version management workspace"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openpyxl>=3.1.5,<4",
    "pyside6>=6.9,<7",
    "pywin32>=310; sys_platform == 'win32'",
    "xlrd>=2.0.2,<3",
]

[project.gui-scripts]
hyacinth = "hyacinth.__main__:main"

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pyinstaller>=6.22.1",
    "pytest>=8.4,<9",
    "pytest-qt>=4.5,<5",
    "ruff>=0.12,<1",
    "types-openpyxl>=3.1.5.20260807",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hyacinth"]

[tool.pytest.ini_options]
addopts = "-q"
markers = [
    "integration: requires locally installed external applications",
    "performance: validates provisional performance thresholds",
]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = [".agent", ".agents", ".playwright-cli", ".superpowers", "output"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
