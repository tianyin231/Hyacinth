    status: "resolved-and-tested"
    summary: "只读 QTableView 已覆写 keyboardSearch 为空操作；百万行防回归测试确认输入文字不再读取数据源，完整质量门通过"
  - id: "SORT-ENGINE-SCOPE-001"
    status: "resolved-by-approved-scope"
    summary: "本切片固定 Python 兼容引擎并拒绝含公式或合并单元格的危险区域，优先贯通完整两阶段版本闭环；COM 高保真排序作为后续增强"
  - id: "VERSION-METADATA-ATOMICITY-001"
    status: "resolved-and-tested"
    summary: "SQLite 与文件目录无法组成单一原子事务；已采用完整暂存快照/清单、原子发布目录、再提交 SQLite，并在提交失败或崩溃窗口保留目录由启动清单补登记"
  - id: "LEGACY-LIBRARY-ROOT-001"
    status: "no-current-data-preserve-fallback"
    summary: "默认 Documents\\Hyacinth 当前不存在，无需本轮迁移真实旧记录；catalog 仍保留无清单旧目录的只读发现，不静默丢失"
  - id: "UI-FIDELITY-001"
    status: "current-milestone-resolved"
    summary: "默认空状态、统一线性图标、控件层级和 Excel 逻辑网格已按批准范围精修并通过空/有数据双场景截图；区域交换、设置材质和主题仍按后续独立功能推进"
  - id: "UI-DEFAULT-WINDOW-SIZE-001"
    status: "resolved-and-tested"
    summary: "首次启动目标 1440x900 并居中，宽高按屏幕可用区域约 90% 收敛，最小 1024x640；纯函数和真实 1440x900 截图已验证"
  - id: "PREVIEW-DATA-ACCESS-001"
    status: "resolved-and-implemented"
    summary: "后台单次流式建立可再生 SQLite 稀疏索引，Qt 虚拟模型通过行缓存按需查询；性能和真实 Worker 已验证"
  - id: "IMPORT-LIBRARY-ROOT-001"
    status: "resolved-by-requirement"
    summary: "原始需求明确默认已上传文件目录为 Windows 文档目录，并允许用户在设置中修改；后续需求未覆盖该默认值"
  - id: "ENV-PERF-BASELINE-001"
    status: "future"
    summary: "大表格暂定阈值已在 16GB/20 逻辑处理器环境通过，仍需在 4 核/8GB/1080p 基线环境复测"
  - id: "ENGINE-PYTHON-FIDELITY-001"
    status: "confirmed-risk"
    summary: "Python 降级转换 xls 时公式只能保留缓存值，复杂样式可能丢失，必须持续显示兼容模式限制"
  - id: "ENV-COM-001"
    status: "verified"
    summary: "Excel 16.0 COM 后台实例已完成真实启动与退出握手"
  - id: "REQ-CLIENT-001"
    status: "tracked"
    summary: "需求讨论记录第 43 节中的项目仍需在后续与客户复核"
  - id: "ENGINE-COM-CANCEL-001"
    status: "future"
    summary: "当前 COM 转换整段视为安全关键阶段，取消会等待完成；后续需要结构化子进程阶段事件，仅在 SaveAs 时禁止强制终止"

